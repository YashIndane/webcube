<!DOCTYPE html>
<html>
  <head>
    <title>Cube Assistant</title>
    <link rel="shortcut icon" type="image/png" href="{{ url_for('static', filename='fav.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous" />
  </head>
  <style>
    #camera {
      width: 400px;
      height: 400px;
      border: 1px solid black;
    }
    #but {
      outline: none;
      background: none;
      padding: 0;
      position: absolute;
      border-radius: 8px;
      width: 352px;
      height: 30px;
      top: 440px;
    }
    #sol {
      position: absolute;
      left: 370px;
      top: 440px;
      background-color: #50A6C2;
      border: none;
      border-radius: 8px;
      color: white;
      width: 352px;
      height: 30px;
    }
    #canvas {
      display: none;
    }
  </style>
  <body style="background-color:#191919;">

    <!-- Replaced webcam.js div with native video element -->
    <video id="camera" autoplay playsinline width="400" height="400"></video>
    <canvas id="canvas" width="400" height="400"></canvas>

    <button onclick="take_snapshot()" id="but" class="btn btn-primary">TAKE SNAPSHOT</button>

    <div id="results">
      <!-- Fixed: GET → POST -->
      <form id="fo" method="POST" action="/process">
      </form>
    </div>

  </body>

  <script>
    var counter = 0;

    // Start rear camera using native getUserMedia
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    }).then(function(stream) {
      document.getElementById('camera').srcObject = stream;
    }).catch(function(err) {
      console.error("Camera error: ", err);
    });

    function take_snapshot() {
      var video = document.getElementById('camera');
      var canvas = document.getElementById('canvas');
      canvas.getContext('2d').drawImage(video, 0, 0, 400, 400);
      var data_uri = canvas.toDataURL('image/jpeg', 0.9);

      var im = counter.toString();

      // Hidden input with image data
      var k = document.createElement('input');
      k.type = "text";
      k.value = data_uri;
      k.name = "ur".concat(im);
      k.id = "xo".concat(im);

      // Submit button
      var i = document.createElement('input');
      i.type = "submit";
      i.value = "GET SOLUTION";
      i.id = "sol";
      i.className = "btn btn-outline-dark";

      document.getElementById('fo').appendChild(k);
      document.getElementById('fo').appendChild(i);

      counter += 1;
    }
  </script>
</html>
